name: 4T-KUT Unified Logic & Hardware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify_lean_proofs:
    name: Lean 4 Kernel Proof Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Invoke Official Lean Prover Compiler
      uses: leanprover/lean-action@v1
      with:
        auto-cache: true

  verify_vhdl_hardware:
    name: GHDL Hardware Simulation Pipeline
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install GHDL Compiler Suite
      run: |
        sudo apt-get update
        sudo apt-get install -y ghdl

    - name: Analyze Optical Router Source
      run: ghdl -a KUT_Optical_Splay.vhd

    - name: Analyze Testbench Stimulus Matrix
      run: ghdl -a KUT_Optical_Splay_tb.vhd

    - name: Elaborate Simulation Workspace
      run: ghdl -e KUT_Optical_Splay_tb

    - name: Execute Electro-Optic Waveguide Run
      run: ghdl -r KUT_Optical_Splay_tb --stop-time=50ns
